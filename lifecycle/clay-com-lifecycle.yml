  deprecation_header: false
  deprecated_operations: []
  note: >-
    NO deprecation policy is published and NO operation in the OpenAPI carries
    `deprecated: true` (grepped: zero matches). RFC 8594 Sunset/Deprecation headers are not
    documented. Clay DOES deprecate endpoints in practice — probing
    https://api.clay.com/v1/openapi.json on 2026-08-14 returned HTTP 404 with the body
    `{"success":false,"message":"deprecated API endpoint"}`, so a prior v1 surface has been
    removed with no published policy governing it. No Deprecation pointer is emitted in
    apis.yml, because a policy page does not exist.
