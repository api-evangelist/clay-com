observations:
- >-
  There is no create/read/update/delete over any Clay noun in the Public API. Every write
  is an execution request and every read is either a job result or a query. An integrator
  cannot manage Clay objects over HTTP — only run them.
- >-
  The pending/error/empty CellResult union means result correctness cannot be inferred from
  the HTTP layer. Any agent using Clay must branch on cell state.
- >-
  Two entities (Routine, Table) are created entirely outside the API, so the API's usable
  surface depends on state a human built in the Clay UI first.
