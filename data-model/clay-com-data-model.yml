note: >-
  Derived from the 47 component schemas and the id-reference path parameters in Clay's
  Public API OpenAPI, cross-read against Clay's published execution model. Clay's API is
  execution-shaped rather than resource-shaped: there is no CRUD over nouns, so the graph
  below is dominated by "job spawns job-result" edges rather than the has_one/has_many
  ownership graph a record API produces.
