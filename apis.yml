apis:
- aid: clay-com:http-api
  name: Clay HTTP API Enrichment
  description: >-
    Generic HTTP request column inside Clay Tables that lets users call any external REST or GraphQL endpoint
    with row-level variables and write the response back into Clay. Acts as Clay's universal API client
    for integrating arbitrary services into a workflow.
  humanURL: https://university.clay.com/docs
  baseURL: https://app.clay.com
  tags:
  - HTTP
  - Enrichment
  - REST
  properties:
  - type: Documentation
    url: https://university.clay.com/docs
  - url: graphql/clay-com-graphql.md
    type: GraphQL
- aid: clay-com:webhooks-incoming
  name: Clay Incoming Webhooks
  description: >-
    Webhook source that pushes data from any external system into a Clay Table as new rows. Used to trigger
    Clay workflows from CRMs, signal providers, and product events.
  humanURL: https://university.clay.com/docs
  baseURL: https://app.clay.com
  tags:
  - Webhook
  - Source
  - Ingest
  tags_raw:
  - Webhooks
  - Source
  - Ingest
  properties:
  - type: Documentation
    url: https://university.clay.com/docs
- aid: clay-com:webhooks-outgoing
  name: Clay Outgoing Webhooks
  description: >-
    Action column that POSTs enriched row data to an external webhook URL, used to deliver Clay-produced
    data to CRMs, sequencers, Slack, and custom backends.
  humanURL: https://university.clay.com/docs
  baseURL: https://app.clay.com
  tags:
  - Webhook
  - Action
  - Export
  tags_raw:
  - Webhooks
  - Action
  - Export
  properties:
  - type: Documentation
    url: https://university.clay.com/docs
- aid: clay-com:tables
  name: Clay Tables
  description: >-
    The core spreadsheet-style workspace that combines source rows, enrichment columns, conditional logic,
    AI agents, and write-back destinations. Tables are the unit of automation and the data plane every
    other integration reads from and writes to.
  humanURL: https://www.clay.com/learn/tables
  baseURL: https://app.clay.com
  tags:
  - Tables
  - Workflows
  - Data
  tags_raw:
  - Tables
  - Workflow
  - Data
  properties:
  - type: Documentation
    url: https://university.clay.com/docs
- aid: clay-com:integrations
  name: Clay Integrations
  description: >-
    Catalog of native connectors and 150+ data providers — Salesforce, HubSpot, Pipedrive, Apollo, Clearbit,
    ZoomInfo, LinkedIn Sales Navigator, Smartlead, Instantly, Apollo, OpenAI, and many more — exposed
    as source, enrichment, signal, and export columns inside Clay Tables.
  humanURL: https://www.clay.com/integrations
  baseURL: https://www.clay.com/integrations
  tags:
  - Integration
  - Marketplace
  - Connectors
  tags_raw:
  - Integrations
  - Marketplace
  - Connectors
  properties:
  - type: Documentation
    url: https://www.clay.com/integrations
- aid: clay-com:chrome-extension
  name: Clay Chrome Extension
  description: >-
    Browser extension for scraping LinkedIn profiles and other web pages directly into Clay Tables, used
    to bootstrap prospect lists from manual research.
  humanURL: https://chromewebstore.google.com/detail/clay/jcdciginbafocoljjicajneijiapongl
  baseURL: https://chromewebstore.google.com/detail/clay/jcdciginbafocoljjicajneijiapongl
  tags:
  - Chrome
  - Extension
  - Scraping
  properties:
  - type: Documentation
    url: https://university.clay.com/docs
- aid: clay-com:mcp
  name: Clay MCP Server
  description: >-
    Clay's hosted remote Model Context Protocol server, letting an MCP client search companies and people,
    run enrichment routines and query Clay tables from natural language. Streamable HTTP at https://api.clay.com/v3/mcp,
    gated by Clay's own OAuth 2.0 authorization server (scope `mcp`) with PKCE, device-code and dynamic
    client registration. Also ships as a local stdio server via `clay mcp` in Clay's official agent plugin
    for Claude Code, Codex and Cursor.
  humanURL: https://developers.clay.com/quickstart
  baseURL: https://api.clay.com/v3/mcp
  tags:
  - MCP
  - Agents
  - Authentication
  tags_raw:
  - MCP
  - Agents
  - OAuth
